<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
  <title id="title">Python 미니 디버거의 실행 상태 전이</title>
  <desc id="desc">PAUSED, RUNNING, TERMINATED 상태 사이에서 명령 입력과 추적 이벤트가 일으키는 전이를 정지 정책별로 나타낸 그림</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px "Pretendard", "Noto Sans KR", sans-serif; fill: #475569; }
      .state { font: 700 21px "Pretendard", "Noto Sans KR", sans-serif; text-anchor: middle; }
      .policy { font: 500 15px "Pretendard", "Noto Sans KR", sans-serif; text-anchor: middle; fill: #047857; }
      .edge { font: 600 16px "Pretendard", "Noto Sans KR", sans-serif; text-anchor: middle; fill: #334155; }
      .guard { font: 500 15px "Pretendard", "Noto Sans KR", sans-serif; text-anchor: middle; fill: #475569; }
      .row-label { font: 700 15px "Pretendard", "Noto Sans KR", sans-serif; fill: #64748b; }
      .legend { font: 500 15px "Pretendard", "Noto Sans KR", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 6 8; }
    </style>
  </defs>

  <rect width="1400" height="1160" rx="24" fill="#ffffff"/>
  <text x="700" y="50" class="title" text-anchor="middle">Python 미니 디버거의 실행 상태 전이</text>
  <text x="700" y="82" class="subtitle" text-anchor="middle">상태는 노드로, 명령·이벤트·조건은 전이 화살표로 표현했다.</text>
  <rect x="405" y="94" width="590" height="32" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="700" y="116" class="legend" text-anchor="middle">공통 우선 전이: RUNNING(모든 policy) ─ breakpoint/watch ─→ PAUSED</text>

  <!-- Initialization -->
  <text x="30" y="139" class="row-label">초기화</text>
  <circle cx="90" cy="185" r="13" fill="#0f172a"/>
  <line x1="105" y1="185" x2="455" y2="185" class="arrow"/>
  <text x="280" y="164" class="edge">실행 시작 / policy ← STEP</text>
  <g filter="url(#shadow)">
    <rect x="460" y="145" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="178" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="204" class="policy">policy = STEP</text>
  <line x1="760" y1="185" x2="1115" y2="185" class="arrow"/>
  <text x="938" y="164" class="edge">첫 line event</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="150" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="193" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="250" x2="1370" y2="250" class="divider"/>

  <!-- STEP -->
  <text x="30" y="294" class="row-label">STEP</text>
  <g filter="url(#shadow)">
    <rect x="50" y="305" width="180" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="140" y="348" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="230" y1="340" x2="455" y2="340" class="arrow"/>
  <text x="343" y="318" class="edge">step 명령 입력</text>
  <text x="343" y="370" class="guard">/ policy ← STEP</text>
  <g filter="url(#shadow)">
    <rect x="460" y="300" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="333" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="359" class="policy">policy = STEP</text>
  <line x1="760" y1="340" x2="1115" y2="340" class="arrow"/>
  <text x="938" y="318" class="edge">line event</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="305" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="348" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="405" x2="1370" y2="405" class="divider"/>

  <!-- CONTINUE -->
  <text x="30" y="449" class="row-label">CONTINUE</text>
  <g filter="url(#shadow)">
    <rect x="50" y="460" width="180" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="140" y="503" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="230" y1="495" x2="455" y2="495" class="arrow"/>
  <text x="343" y="473" class="edge">continue 명령 입력</text>
  <text x="343" y="525" class="guard">/ policy ← CONTINUE</text>
  <g filter="url(#shadow)">
    <rect x="460" y="455" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="488" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="514" class="policy">policy = CONTINUE</text>
  <line x1="760" y1="495" x2="1115" y2="495" class="arrow"/>
  <text x="938" y="473" class="edge">breakpoint 일치 또는 watch 값 변경</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="460" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="503" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="560" x2="1370" y2="560" class="divider"/>

  <!-- NEXT -->
  <text x="30" y="604" class="row-label">NEXT</text>
  <g filter="url(#shadow)">
    <rect x="50" y="615" width="180" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="140" y="658" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="230" y1="650" x2="455" y2="650" class="arrow"/>
  <text x="343" y="621" class="edge">next 명령 입력</text>
  <text x="343" y="643" class="guard">/ policy ← NEXT</text>
  <text x="343" y="675" class="guard">resume frame ← F</text>
  <g filter="url(#shadow)">
    <rect x="460" y="610" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="643" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="669" class="policy">policy = NEXT, frame = F</text>
  <line x1="760" y1="650" x2="1115" y2="650" class="arrow"/>
  <text x="938" y="621" class="edge">line [frame = F ∧ line ≠ 시작 line]</text>
  <text x="938" y="678" class="guard">또는 return [frame = F]</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="615" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="658" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="715" x2="1370" y2="715" class="divider"/>

  <!-- UNTIL -->
  <text x="30" y="759" class="row-label">UNTIL</text>
  <g filter="url(#shadow)">
    <rect x="50" y="770" width="180" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="140" y="813" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="230" y1="805" x2="455" y2="805" class="arrow"/>
  <text x="343" y="770" class="edge">until 명령 입력</text>
  <text x="343" y="792" class="guard">/ policy ← UNTIL</text>
  <text x="343" y="832" class="guard">frame ← F, target ← L</text>
  <g filter="url(#shadow)">
    <rect x="460" y="765" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="798" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="824" class="policy">policy = UNTIL, frame = F, target = L</text>
  <line x1="760" y1="805" x2="1115" y2="805" class="arrow"/>
  <text x="938" y="776" class="edge">line [frame = F ∧ line &gt; L]</text>
  <text x="938" y="832" class="guard">또는 return [frame = F]</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="770" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="813" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="870" x2="1370" y2="870" class="divider"/>

  <!-- FINISH -->
  <text x="30" y="914" class="row-label">FINISH</text>
  <g filter="url(#shadow)">
    <rect x="50" y="925" width="180" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="140" y="968" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="230" y1="960" x2="455" y2="960" class="arrow"/>
  <text x="343" y="931" class="edge">finish 명령 입력</text>
  <text x="343" y="953" class="guard">/ policy ← FINISH</text>
  <text x="343" y="985" class="guard">resume frame ← F</text>
  <g filter="url(#shadow)">
    <rect x="460" y="920" width="300" height="80" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="610" y="953" class="state" fill="#065f46">RUNNING</text>
  <text x="610" y="979" class="policy">policy = FINISH, frame = F</text>
  <line x1="760" y1="960" x2="1115" y2="960" class="arrow"/>
  <text x="938" y="938" class="edge">return event</text>
  <text x="938" y="988" class="guard">[현재 frame = F]</text>
  <g filter="url(#shadow)">
    <rect x="1120" y="925" width="200" height="70" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1220" y="968" class="state" fill="#1d4ed8">PAUSED</text>

  <line x1="30" y1="1025" x2="1370" y2="1025" class="divider"/>

  <!-- Termination -->
  <text x="30" y="1069" class="row-label">종료</text>
  <rect x="90" y="1075" width="160" height="58" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="1111" class="state" fill="#1d4ed8">PAUSED</text>
  <line x1="250" y1="1104" x2="445" y2="1104" class="arrow"/>
  <text x="348" y="1087" class="edge">quit 명령</text>
  <rect x="450" y="1075" width="210" height="58" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="555" y="1111" class="state" fill="#475569">TERMINATED</text>

  <rect x="760" y="1075" width="180" height="58" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="850" y="1111" class="state" fill="#065f46">RUNNING</text>
  <line x1="940" y1="1104" x2="1115" y2="1104" class="arrow"/>
  <text x="1028" y="1087" class="edge">프로그램 종료</text>
  <rect x="1120" y="1075" width="210" height="58" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1225" y="1111" class="state" fill="#475569">TERMINATED</text>
</svg>
